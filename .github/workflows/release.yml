# Publishing a GitHub release (web UI or `gh release create vX.Y.Z`) builds both
# apps and attaches the self-update channel assets that UpdateManager reads from
# `releases/latest/download/`:
#   version.txt       + app-release.apk         (TV)
#   version-phone.txt + app-phone-release.apk   (phone)
#
# The tag is the single source of truth for the version:
#   vMAJOR.MINOR.PATCH -> versionName MAJOR.MINOR.PATCH,
#                         versionCode MAJOR*10000 + MINOR*100 + PATCH
# Installed apps only offer an update when the new versionCode is higher, so
# every release tag must be greater than the previous one.
#
# Pre-releases run the same build but are never served by `releases/latest`,
# so they are safe for testing the pipeline without reaching users.
name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name }}

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      # Every installed copy was signed with this certificate; an APK signed
      # with anything else cannot install over it.
      EXPECTED_CERT_SHA256: aa842d1527b7308a7796e752ae79d9256f8dfdaf7107513759c29ca1c03ab06a
    steps:
      - uses: actions/checkout@v7

      - name: Derive version from tag
        run: |
          if [[ ! "$TAG" =~ ^v([0-9]+)\.([0-9]{1,2})\.([0-9]{1,2})$ ]]; then
            echo "::error::Tag '$TAG' must look like v1.2.3 (minor and patch < 100)"
            exit 1
          fi
          name="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
          code=$(( 10#${BASH_REMATCH[1]} * 10000 + 10#${BASH_REMATCH[2]} * 100 + 10#${BASH_REMATCH[3]} ))
          echo "VERSION_NAME=$name" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$code" >> "$GITHUB_ENV"
          echo "Building $name (versionCode $code)"

      - name: Require a higher versionCode than the previous release
        if: ${{ !github.event.release.prerelease }}
        run: |
          prev=0
          for t in $(gh release list --exclude-drafts --exclude-pre-releases --limit 20 \
                       --json tagName --jq '.[].tagName'); do
            [[ "$t" == "$TAG" ]] && continue
            if v=$(gh release download "$t" --pattern version.txt --output - 2>/dev/null); then
              prev=$(( v > prev ? v : prev ))
            fi
          done
          echo "Highest published TV versionCode: $prev"
          if (( VERSION_CODE <= prev )); then
            echo "::error::versionCode $VERSION_CODE is not higher than $prev; installed apps would never offer this update. Use a higher tag."
            exit 1
          fi

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - name: Install signing key
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
        run: |
          if [[ -z "$RELEASE_KEYSTORE_B64" ]]; then
            echo "::error::Repository secret RELEASE_KEYSTORE_B64 is not set"
            exit 1
          fi
          # Both apps sign release builds with the debug signing config, which
          # AGP reads from $ANDROID_USER_HOME/debug.keystore.
          export ANDROID_USER_HOME="$RUNNER_TEMP/android-user-home"
          mkdir -p "$ANDROID_USER_HOME"
          echo "$RELEASE_KEYSTORE_B64" | base64 -d > "$ANDROID_USER_HOME/debug.keystore"
          echo "ANDROID_USER_HOME=$ANDROID_USER_HOME" >> "$GITHUB_ENV"

      - name: Test and build
        run: |
          ./gradlew --no-daemon \
            -PreleaseVersionCode="$VERSION_CODE" \
            -PreleaseVersionName="$VERSION_NAME" \
            :core:testDebugUnitTest :app:assembleRelease :app-phone:assembleRelease

      - name: Verify signatures and versions
        run: |
          build_tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/
          cp app-phone/build/outputs/apk/release/app-phone-release.apk dist/
          for apk in dist/*.apk; do
            # Captured whole (not piped into head/grep -q) so pipefail never
            # trips on SIGPIPE. Matches both "V2 Signer:" and "Signer #1" output.
            certs=$("$build_tools/apksigner" verify --print-certs "$apk")
            if ! grep -qE "[Ss]igner.* certificate SHA-256 digest: $EXPECTED_CERT_SHA256\$" <<< "$certs"; then
              echo "::error::$apk is not signed with $EXPECTED_CERT_SHA256"
              echo "$certs" | grep 'SHA-256'
              exit 1
            fi
            badging=$("$build_tools/aapt2" dump badging "$apk")
            if ! grep -q "versionCode='$VERSION_CODE' versionName='$VERSION_NAME'" <<< "$badging"; then
              echo "::error::$apk has the wrong version"
              exit 1
            fi
          done
          echo "$VERSION_CODE" > dist/version.txt
          echo "$VERSION_CODE" > dist/version-phone.txt

      - name: Attach assets to release
        run: |
          # APKs first: a client that sees the new version file must be able
          # to download the matching APK.
          gh release upload "$TAG" dist/app-release.apk dist/app-phone-release.apk --clobber
          gh release upload "$TAG" dist/version.txt dist/version-phone.txt --clobber
